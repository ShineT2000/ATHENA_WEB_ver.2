name: Build and check ATHENA
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site-base: ['', '/athena-preview']
    env:
      SITE_BASE: ${{ matrix.site-base }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python build.py
      - run: python verify.py
