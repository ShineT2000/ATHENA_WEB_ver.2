# Graduate Students
# 한 사람 = [[group.person]] 블록 하나. 순서대로 화면에 표시됩니다.
# 사진은 static/img/people/ 에 넣고 파일 이름만 적습니다.
# since = 입학 연월(이름 옆 괄호에 표시), keywords = KEY WORD 줄의 키워드
# program = 입학 과정: integrated(석박통합), phd(박사), masters(석사)
# 분류 기준일: 2026.11. 경과 개월 수 = (기준 연도 - 입학 연도) * 12 + 기준 월 - 입학 월.
# Ph.D. Candidates: 박사 24개월 이상 또는 석박통합 36개월 이상.
# Ph.D. Students: 박사 24개월 미만 또는 석박통합 24개월 이상 36개월 미만.
# M.S. Students: 석사 과정 또는 석박통합 24개월 미만.
# 각 그룹 안에서는 누적 학업기간이 긴 순서로 표시합니다.
# 누적 학업기간 = 입학 후 경과 개월 수 + 석사학위 취득자의 추정 석사 학업기간(24개월).
# 학업기간이 같으면 기존 상대 순서를 유지합니다. 그룹 분류는 위 입학 후 경과 개월 기준을 유지합니다.

